<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1.0" />
<title>Trail de Ficalho 2027 — Tactile Brutalism Daily Card</title>
<style>
  :root {
    --bg: #F6F2E9;
    --ink: #111111;
    --surface: #FFFFFF;
    --hero-bg: #FFD426;
    --accent-coral: #FF6B4A;
    --accent-mint: #A8E6CF;
    --accent-lavender: #D6C6FF;
    --accent-sky: #B8E1FF;
    --border: 4px solid #111111;
    --shadow: 6px 6px 0px #111111;
    --shadow-sm: 4px 4px 0px #111111;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #111111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  #card {
    width: 1080px;
    height: 1080px;
    padding: 34px;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(17, 17, 17, 0.09) 1.25px, transparent 0);
    background-size: 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .mono {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
  }

  /* Header Bar */
  .header {
    background: var(--ink);
    color: var(--bg);
    border: var(--border);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .date-pill {
    background: var(--accent-coral);
    color: var(--ink);
    border: 3px solid var(--bg);
    padding: 5px 14px;
    font-size: 17px;
    font-weight: 900;
    white-space: nowrap;
  }

  /* Hero Workout Block */
  .hero {
    background: var(--hero-bg);
    border: var(--border);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .tag {
    background: var(--ink);
    color: var(--bg);
    padding: 4px 12px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .body-rule {
    background: var(--surface);
    color: var(--ink);
    border: 2.5px solid var(--ink);
    padding: 3px 10px;
    font-size: 14px;
    font-weight: 800;
  }

  .workout-title {
    font-size: 48px;
    font-weight: 950;
    line-height: 1.04;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }

  .workout-sub {
    font-size: 19px;
    font-weight: 700;
  }

  /* Compact 3-Box Macro Strip */
  .targets-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .target-box {
    border: 3px solid var(--ink);
    box-shadow: var(--shadow-sm);
    padding: 9px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .target-box.kcal { background: var(--accent-mint); }
  .target-box.protein { background: var(--accent-lavender); }
  .target-box.water { background: var(--accent-sky); }

  .target-label {
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .target-val {
    font-size: 24px;
    font-weight: 950;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  /* Tall Main Two-Column Grid: AM Stack & Fuel Log */
  .main-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 18px;
    min-height: 0;
  }

  .panel {
    background: var(--surface);
    border: var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-title {
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .panel-list {
    padding: 16px 20px;
    list-style: none;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    flex: 1;
    gap: 10px;
    font-size: 21px;
    font-weight: 650;
    line-height: 1.28;
  }

  .panel-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .bullet {
    font-weight: 950;
    flex-shrink: 0;
  }

  /* Footer Protocol Strip */
  .footer {
    background: var(--accent-coral);
    border: var(--border);
    box-shadow: var(--shadow-sm);
    padding: 11px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .footer-badge {
    background: var(--ink);
    color: var(--bg);
    padding: 3px 10px;
    font-size: 13px;
    font-weight: 900;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <main id="card">
    <header class="header">
      <span class="mono" id="badge">TRAIL DE FICALHO 2027</span>
      <span class="date-pill mono" id="day-label">TUE 24 NOV</span>
    </header>

    <section class="hero" id="hero-card">
      <div class="hero-top">
        <span class="tag mono" id="session-tag">PRIMARY SESSION</span>
        <span class="body-rule mono" id="body-rule">BODY &le; 2/10</span>
      </div>
      <div class="workout-title" id="training-title">6 KM FLAT EASY RUN</div>
      <div class="workout-sub mono" id="training-sub">HR &lt; 142 BPM &bull; PHASE 1 BASE</div>
    </section>

    <section class="targets-strip">
      <div class="target-box kcal">
        <span class="target-label mono">KCAL</span>
        <span class="target-val mono" id="kcal">2,700</span>
      </div>
      <div class="target-box protein">
        <span class="target-label mono">PRO</span>
        <span class="target-val mono" id="protein">160g</span>
      </div>
      <div class="target-box water">
        <span class="target-label mono">H2O</span>
        <span class="target-val mono" id="water">3.0L</span>
      </div>
    </section>

    <section class="main-grid">
      <div class="panel">
        <div class="panel-title mono">AM STACK</div>
        <ul class="panel-list" id="am-stack"></ul>
      </div>

      <div class="panel">
        <div class="panel-title mono">FUEL LOG</div>
        <ul class="panel-list" id="fuel-log"></ul>
      </div>
    </section>

    <footer class="footer">
      <span class="footer-badge mono">PM &amp; FOCUS</span>
      <span class="mono" id="pm-protocol"></span>
    </footer>
  </main>

<script>
  const THEMES = {
    RUN:  "#FFD426",
    LIFT: "#FF9F45",
    SWIM: "#9BE7D8",
    REST: "#D6C6FF"
  };

  const fallbackData = {
    Badge: "FICALHO 50K // PH.1",
    Day_Label: "Tue, Nov 24",
    Subtitle: "6 km flat easy run • HR < 142 bpm",
    Kcal: "2,700",
    Protein: "160g",
    Water: "3.0L",
    Body_Rule: "Body ≤ 2/10",
    Training_Type: "RUN",
    Training_Title: "6 km Flat Easy Run",
    Training_Sub: "Easy aerobic pace • HR < 142 bpm",
    Morning_Stack: "30mg Elvanse • Vivo WHOLE + ½ Vegan Pro + 350ml Oat Milk • 5g Creatine • 2ml Omega-3 • 0.5ml D3/K2",
    Focus_Hydration: "Coffee/Tea + 200mg L-Theanine • Cutoff 14:00 • Mag Glycinate PM",
    Lunch: "Rugbrød Plate: Eggs, Cheese & Greens",
    Snack: "350ml Kefir + 1 Scoop Vegan Pro + Fruit",
    Dinner: "Rice, Beans & Tofu Bowl"
  };

  const d = window.__CARD_DATA__ || fallbackData;
  const heroColor = THEMES[(d.Training_Type || "").toUpperCase()] || THEMES.RUN;
  document.documentElement.style.setProperty("--hero-bg", heroColor);

  function renderList(elId, items) {
    const ul = document.getElementById(elId);
    ul.innerHTML = "";
    items.filter(Boolean).forEach((text) => {
      const li = document.createElement("li");
      const bullet = document.createElement("span");
      bullet.className = "bullet";
      bullet.textContent = "▪";
      const span = document.createElement("span");
      span.textContent = text;
      li.appendChild(bullet);
      li.appendChild(span);
      ul.appendChild(li);
    });
  }

  document.getElementById("badge").textContent = d.Badge || fallbackData.Badge;
  document.getElementById("day-label").textContent = d.Day_Label || fallbackData.Day_Label;
  document.getElementById("body-rule").textContent = d.Body_Rule || fallbackData.Body_Rule;
  document.getElementById("training-title").textContent = d.Training_Title || fallbackData.Training_Title;
  document.getElementById("training-sub").textContent = d.Training_Sub || d.Subtitle || fallbackData.Training_Sub;

  document.getElementById("kcal").textContent = (d.Kcal || fallbackData.Kcal).replace(/\s*kcal$/i, "");
  document.getElementById("protein").textContent = (d.Protein || fallbackData.Protein).replace(/\s*PRO$/i, "");
  document.getElementById("water").textContent = (d.Water || fallbackData.Water).replace(/\s*Water$/i, "L");

  const stackItems = Array.isArray(d.Morning_Stack_List)
    ? d.Morning_Stack_List
    : (d.Morning_Stack || fallbackData.Morning_Stack).split(/\s*[•|]\s*/);

  const fuelItems = [
    d.Lunch ? `LUNCH: ${d.Lunch}` : `LUNCH: ${fallbackData.Lunch}`,
    d.Snack ? `SNACK: ${d.Snack}` : `SNACK: ${fallbackData.Snack}`,
    d.Dinner ? `DINNER: ${d.Dinner}` : `DINNER: ${fallbackData.Dinner}`
  ];

  renderList("am-stack", stackItems);
  renderList("fuel-log", fuelItems);

  document.getElementById("pm-protocol").textContent =
    d.Focus_Hydration || d.Evening || fallbackData.Focus_Hydration;
</script>
</body>
</html>
