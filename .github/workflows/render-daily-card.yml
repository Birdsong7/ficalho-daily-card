name: Render Daily Liquid Glass Card

on:
  schedule:
    - cron: '25 17 * * *'
    - cron: '25 18 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Optional date preview (YYYY-MM-DD, leave blank for tomorrow)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Render tomorrow.png
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: node render_card.js

      - name: Commit and push updated card
        run: |
          git config user.name "Daily Card Bot"
          git config user.email "bot@users.noreply.github.com"
          git add tomorrow.png
          git diff --staged --quiet || (git commit -m "Update daily card $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
